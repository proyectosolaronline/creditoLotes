<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Lotes - FRanccionamiento San pedro</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Estilos personalizados -->
    <style>
        :root {
            --primary: #0f4c81;
            --accent: #00e5b0;
            --danger: #e74c3c;
            --warning: #f39c12;
            --success: #27ae60;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #0f4c81 0%, #1a6fb5 100%);
            color: white;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(15, 76, 129, 0.2);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* BADGE DE CONTEO */
        .badge-count {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-count span {
            font-size: 1.2rem;
            margin-right: 2px;
        }

        /* MAIN LAYOUT */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* MAPA */
        #map {
            flex: 1;
            z-index: 1;
        }

        /* PANEL LATERAL */
        .sidebar {
            width: 380px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 24px rgba(0,0,0,0.06);
            z-index: 500;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eef1f5;
            background: #fafbfc;
        }

        .sidebar-header h3 {
            font-size: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* FILTROS */
        .filters {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #eef1f5;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 7px 14px;
            border-radius: 50px;
            border: 1.5px solid #dde4ed;
            background: white;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #5a6c7d;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--primary);
            background: #f0fdf9;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f4c81;
            font-weight: 600;
        }

        /* LISTA DE LOTES */
        .lotes-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .lote-card {
            background: white;
            border: 1px solid #edf0f5;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .lote-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0,229,176,0.1);
            transform: translateX(3px);
        }

        .lote-card.active-card {
            border-color: var(--primary);
            background: #f8fbff;
            box-shadow: 0 4px 16px rgba(15,76,129,0.1);
        }

        .lote-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .lote-codigo {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
        }

        .lote-estado {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .estado-disponible {
            background: #e8f8f0;
            color: #1a7a4c;
        }

        .estado-reservado {
            background: #fef5e7;
            color: #b7791f;
        }

        .estado-vendido {
            background: #fde8e8;
            color: #9b2c2c;
        }

        .lote-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            font-size: 0.78rem;
            color: #6b7d8e;
            margin-top: 8px;
        }

        .lote-info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lote-info-item strong {
            color: var(--text);
            font-weight: 600;
        }

        .lote-valor {
            font-size: 1rem;
            font-weight: 700;
            color: var(--success);
            margin-top: 4px;
        }

        /* LOADING */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            display: none;
            align-items: center;
            gap: 12px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e0e6ed;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* MENSAJE VACÍO */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0b0c0;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 40vh;
                flex-shrink: 0;
            }
            
            #map {
                flex: 1;
                min-height: 300px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 1.1rem;
            }
        }

        /* TOOLTIP PERSONALIZADO */
        .leaflet-tooltip.lote-tooltip {
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            padding: 10px 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 0.82rem;
            color: var(--text);
        }

        .leaflet-tooltip.lote-tooltip::before {
            border-top-color: white;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">🏠</div>
            <div>
                <h1>Mapa de Lotes</h1>
                <div class="header-subtitle">SimPréstamo · Visualización geográfica</div>
            </div>
        </div>
        <div class="badge-count">
            <span id="totalCount">0</span> lotes cargados
        </div>
    </div>

    <!-- LOADING -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Cargando lotes...</span>
    </div>

    <!-- MAIN -->
    <div class="main-container">
        <!-- MAPA -->
        <div id="map"></div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>📍 Catálogo de Lotes</h3>
            </div>

            <!-- FILTROS -->
            <div class="filters">
                <button class="filter-btn active" data-filter="todos">Todos</button>
                <button class="filter-btn" data-filter="Disponible">✅ Disponibles</button>
                <button class="filter-btn" data-filter="Reservado">⏳ Reservados</button>
                <button class="filter-btn" data-filter="Vendido">❌ Vendidos</button>
            </div>

            <!-- LISTA -->
            <div class="lotes-list" id="lotesList">
                <div class="empty-state">
                    <div class="icon">📍</div>
                    <p>Cargando lotes...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // =============================================
        // CONFIGURACIÓN
        // =============================================
        const CONFIG = {
            // URL de tu Google Apps Script (cambiar por la real)
            SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbw83md07bzx1UmGRn51i-pRiuvQaEig_mUWS4VjvO0yTIlDCULqT8p3NGsSe2S4nZhzjA/exec',
            
            // Centro del mapa por defecto (México)
            CENTER_LAT: 20.5888,
            CENTER_LNG: -100.3899,
            DEFAULT_ZOOM: 6,
            
            // Colores por estado
            ESTADO_COLORS: {
                'Disponible': '#27ae60',
                'Reservado': '#f39c12',
                'Vendido': '#e74c3c'
            },
            
            // Íconos por estado
            ESTADO_ICONS: {
                'Disponible': '✅',
                'Reservado': '⏳',
                'Vendido': '❌'
            }
        };

        // =============================================
        // VARIABLES GLOBALES
        // =============================================
        let mapa = null;
        let marcadores = [];
        let todosLotes = [];
        let filtroActivo = 'todos';

        // =============================================
        // INICIALIZAR MAPA
        // =============================================
        function inicializarMapa() {
            mapa = L.map('map', {
                center: [CONFIG.CENTER_LAT, CONFIG.CENTER_LNG],
                zoom: CONFIG.DEFAULT_ZOOM,
                zoomControl: true,
                attributionControl: true
            });

            // Capa de tiles (OpenStreetMap)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | SimPréstamo',
                maxZoom: 19
            }).addTo(mapa);

            // Control de escala
            L.control.scale({
                imperial: false,
                metric: true,
                position: 'bottomleft'
            }).addTo(mapa);

            return mapa;
        }

        // =============================================
        // CARGAR LOTES DESDE GOOGLE APPS SCRIPT
        // =============================================
        async function cargarLotes() {
            mostrarLoading(true);
            
            try {
                const url = `${CONFIG.SCRIPT_URL}?tipo=lotes`;
                const respuesta = await fetch(url);
                
                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }
                
                const data = await respuesta.json();
                
                if (!data.success) {
                    throw new Error(data.message || 'Error al obtener lotes');
                }
                
                todosLotes = data.data.lotes || [];
                
                // Filtrar lotes que tengan coordenadas válidas
                const lotesConCoordenadas = todosLotes.filter(lote => {
                    const lat = parseFloat(lote.lat);
                    const lng = parseFloat(lote.lng);
                    return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
                });
                
                console.log(`✅ ${lotesConCoordenadas.length} lotes con coordenadas cargados`);
                
                // Actualizar conteo
                document.getElementById('totalCount').textContent = lotesConCoordenadas.length;
                
                // Renderizar
                renderizarMarcadores(lotesConCoordenadas);
                renderizarLista(lotesConCoordenadas);
                
                // Ajustar vista si hay lotes
                if (lotesConCoordenadas.length > 0) {
                    const bounds = lotesConCoordenadas.map(l => [parseFloat(l.lat), parseFloat(l.lng)]);
                    mapa.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
                }
                
                mostrarLoading(false);
                
            } catch (error) {
                console.error('❌ Error cargando lotes:', error);
                mostrarLoading(false);
                mostrarError(`Error al cargar lotes: ${error.message}`);
            }
        }

        // =============================================
        // RENDERIZAR MARCADORES EN EL MAPA
        // =============================================
        function renderizarMarcadores(lotes) {
            // Limpiar marcadores existentes
            marcadores.forEach(m => mapa.removeLayer(m));
            marcadores = [];
            
            lotes.forEach(lote => {
                const lat = parseFloat(lote.lat);
                const lng = parseFloat(lote.lng);
                const color = CONFIG.ESTADO_COLORS[lote.estado] || '#95a5a6';
                
                // Crear ícono personalizado
                const icono = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="
                        background: ${color};
                        width: 36px;
                        height: 36px;
                        border-radius: 50% 50% 50% 0;
                        transform: rotate(-45deg);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 3px 12px rgba(0,0,0,0.2);
                        border: 3px solid white;
                    ">
                        <span style="transform: rotate(45deg); font-size: 16px;">🏠</span>
                    </div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -38]
                });
                
                const marcador = L.marker([lat, lng], { icon: icono }).addTo(mapa);
                
                // Tooltip al pasar el mouse
                const tooltipContent = `
                    <strong>${lote.codigolote || 'Sin código'}</strong><br>
                    ${CONFIG.ESTADO_ICONS[lote.estado] || ''} ${lote.estado || 'Sin estado'}<br>
                    ${lote.valor ? '$' + Number(lote.valor).toLocaleString('es-MX') : ''}
                `;
                
                marcador.bindTooltip(tooltipContent, {
                    className: 'lote-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });
                
                // Popup al hacer clic
                const popupContent = crearContenidoPopup(lote);
                marcador.bindPopup(popupContent, {
                    maxWidth: 300,
                    className: 'lote-popup'
                });
                
                // Al hacer clic en el marcador, resaltar tarjeta
                marcador.on('click', () => {
                    resaltarTarjeta(lote.idLote);
                });
                
                marcadores.push(marcador);
            });
        }

        // =============================================
        // CREAR CONTENIDO DEL POPUP
        // =============================================
        function crearContenidoPopup(lote) {
            const valorFormateado = lote.valor 
                ? '$' + Number(lote.valor).toLocaleString('es-MX', { minimumFractionDigits: 2 })
                : 'No especificado';
            
            const metros = lote.metros ? `${lote.metros} ${lote.medida || 'm²'}` : 'No especificado';
            
            let html = `
                <div style="font-family: 'Segoe UI', sans-serif; padding: 4px 0;">
                    <h3 style="margin:0 0 6px; color: #0f4c81; font-size: 1rem;">
                        🏠 ${lote.codigolote || 'Lote sin código'}
                    </h3>
                    <span style="
                        display: inline-block;
                        background: ${CONFIG.ESTADO_COLORS[lote.estado] || '#95a5a6'};
                        color: white;
                        padding: 3px 10px;
                        border-radius: 50px;
                        font-size: 0.7rem;
                        font-weight: 600;
                        margin-bottom: 8px;
                    ">
                        ${lote.estado || 'Sin estado'}
                    </span>
                    <hr style="border: none; border-top: 1px solid #eef1f5; margin: 8px 0;">
                    <table style="width: 100%; font-size: 0.8rem; color: #5a6c7d;">
                        <tr>
                            <td><strong>💰 Valor:</strong></td>
                            <td style="color: #27ae60; font-weight: 700;">${valorFormateado}</td>
                        </tr>
                        <tr>
                            <td><strong>📐 Medida:</strong></td>
                            <td>${metros}</td>
                        </tr>
                        <tr>
                            <td><strong>💳 Pago:</strong></td>
                            <td>${lote.tipopago || 'No especificado'}</td>
                        </tr>
                        <tr>
                            <td><strong>📍 Localidad:</strong></td>
                            <td>${lote.localidad || 'No especificada'}</td>
                        </tr>
                        <tr>
                            <td><strong>📅 Fecha:</strong></td>
                            <td>${lote.fecha || 'No registrada'}</td>
                        </tr>
                    </table>
                    ${lote.fotolote ? `
                        <img src="${lote.fotolote}" 
                             style="width: 100%; border-radius: 8px; margin-top: 8px; max-height: 150px; object-fit: cover;"
                             alt="Foto del lote"
                             onerror="this.style.display='none'">
                    ` : ''}
                    <div style="margin-top: 8px;">
                        <a href="https://www.google.com/maps?q=${lote.lat},${lote.lng}" 
                           target="_blank"
                           style="
                               display: inline-block;
                               background: #0f4c81;
                               color: white;
                               padding: 6px 14px;
                               border-radius: 50px;
                               text-decoration: none;
                               font-size: 0.75rem;
                               font-weight: 600;
                           ">
                            🗺️ Abrir en Google Maps
                        </a>
                    </div>
                </div>
            `;
            
            return html;
        }

        // =============================================
        // RENDERIZAR LISTA LATERAL
        // =============================================
        function renderizarLista(lotes) {
            const contenedor = document.getElementById('lotesList');
            
            if (lotes.length === 0) {
                contenedor.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No se encontraron lotes</p>
                        <small>${filtroActivo !== 'todos' ? 'Prueba con otro filtro' : 'No hay lotes registrados'}</small>
                    </div>
                `;
                return;
            }
            
            contenedor.innerHTML = lotes.map(lote => {
                const color = CONFIG.ESTADO_COLORS[lote.estado] || '#95a5a6';
                const icono = CONFIG.ESTADO_ICONS[lote.estado] || '📍';
                const valorFormateado = lote.valor 
                    ? '$' + Number(lote.valor).toLocaleString('es-MX')
                    : 'N/A';
                const claseEstado = `estado-${(lote.estado || 'disponible').toLowerCase()}`;
                
                return `
                    <div class="lote-card" 
                         data-id="${lote.idLote}" 
                         data-lat="${lote.lat}" 
                         data-lng="${lote.lng}"
                         onclick="centrarEnLote('${lote.idLote}', ${lote.lat}, ${lote.lng})">
                        <div class="lote-card-header">
                            <span class="lote-codigo">🏠 ${lote.codigolote || 'Sin código'}</span>
                            <span class="lote-estado ${claseEstado}">${icono} ${lote.estado || 'Sin estado'}</span>
                        </div>
                        <div class="lote-valor">${valorFormateado}</div>
                        <div class="lote-info">
                            <div class="lote-info-item">
                                📐 <strong>${lote.metros || 'N/A'} ${lote.medida || 'm²'}</strong>
                            </div>
                            <div class="lote-info-item">
                                💳 ${lote.tipopago || 'N/A'}
                            </div>
                            <div class="lote-info-item">
                                📍 ${lote.localidad || 'Sin localidad'}
                            </div>
                            <div class="lote-info-item">
                                📅 ${lote.fecha || 'N/A'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // =============================================
        // CENTRAR MAPA EN UN LOTE
        // =============================================
        function centrarEnLote(idLote, lat, lng) {
            mapa.setView([lat, lng], 16, {
                animate: true,
                duration: 0.5
            });
            
            // Resaltar tarjeta
            resaltarTarjeta(idLote);
            
            // Abrir popup del marcador correspondiente
            const index = todosLotes.findIndex(l => l.idLote == idLote);
            if (index >= 0 && marcadores[index]) {
                marcadores[index].openPopup();
            }
        }

        // =============================================
        // RESALTAR TARJETA EN LA LISTA
        // =============================================
        function resaltarTarjeta(idLote) {
            document.querySelectorAll('.lote-card').forEach(card => {
                card.classList.remove('active-card');
            });
            
            const cardActiva = document.querySelector(`.lote-card[data-id="${idLote}"]`);
            if (cardActiva) {
                cardActiva.classList.add('active-card');
                cardActiva.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // =============================================
        // FILTRAR LOTES
        // =============================================
        function filtrarLotes(estado) {
            filtroActivo = estado;
            
            // Actualizar botones
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const btnActivo = document.querySelector(`.filter-btn[data-filter="${estado}"]`);
            if (btnActivo) btnActivo.classList.add('active');
            
            // Filtrar
            let lotesFiltrados = todosLotes.filter(lote => {
                const lat = parseFloat(lote.lat);
                const lng = parseFloat(lote.lng);
                const tieneCoords = !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
                
                if (!tieneCoords) return false;
                if (estado === 'todos') return true;
                return lote.estado === estado;
            });
            
            // Actualizar vista
            renderizarMarcadores(lotesFiltrados);
            renderizarLista(lotesFiltrados);
            document.getElementById('totalCount').textContent = lotesFiltrados.length;
            
            // Reajustar bounds
            if (lotesFiltrados.length > 0) {
                const bounds = lotesFiltrados.map(l => [parseFloat(l.lat), parseFloat(l.lng)]);
                mapa.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
            }
        }

        // =============================================
        // UTILIDADES
        // =============================================
        function mostrarLoading(mostrar) {
            const overlay = document.getElementById('loadingOverlay');
            if (mostrar) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        function mostrarError(mensaje) {
            const contenedor = document.getElementById('lotesList');
            contenedor.innerHTML = `
                <div class="empty-state">

                    <p style="color: #e74c3c;">${mensaje}</p>
                    <button onclick="cargarLotes()" style="
                        margin-top: 12px;
                        padding: 8px 20px;
                        background: #0f4c81;
                        color: white;
                        border: none;
                        border-radius: 50px;
                        cursor: pointer;
                        font-weight: 600;
                    ">Reintentar</button>
                </div>
            `;
        }

        // =============================================
        // EVENTOS
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            inicializarMapa();
            cargarLotes();
            
            // Eventos de filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const filtro = btn.getAttribute('data-filter');
                    filtrarLotes(filtro);
                });
            });
        });
