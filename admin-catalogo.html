<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Catálogo</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f0f2f5;padding:20px}
        .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
        h2{font-size:16px;color:#1a73e8}
        .fila{display:flex;align-items:center;gap:10px;margin:8px 0}
        .fila img{width:60px;height:60px;border-radius:8px;background:#eee}
        .fila input[type="text"]{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px}
        .btn{padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;margin-top:10px}
        .btn-back{position:fixed;bottom:20px;left:20px;background:#fff;color:#333;width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3)}
        .msg{padding:10px;text-align:center;font-weight:bold;display:none}
        .ok{background:#d4edda;color:#155724}
        .err{background:#f8d7da;color:#721c24}
    </style>
</head>
<body>
    <h2>🖼️ Editar Catálogo</h2>
    <div id="msg" class="msg"></div>
    <div class="card">
        <p><strong>🏢 Datos del Usuario</strong></p>
        <p id="info">Cargando...</p>
    </div>
    <div id="fotos"></div>
    <button class="btn" onclick="guardar()">💾 Guardar</button>
    <button class="btn-back" onclick="history.back()">←</button>

    <script>
        const API = 'https://script.google.com/macros/s/AKfycbw83md07bzx1UmGRn51i-pRiuvQaEig_mUWS4VjvO0yTIlDCULqT8p3NGsSe2S4nZhzjA/exec';
        const ID = 'USR-001';
        var ft = ['','','',''];

        async function init(){
            try{
                var r = await fetch(API+'?tipo=negocios');
                var d = await r.json();
                if(d.success && d.data && d.data.negocios){
                    var u = d.data.negocios.find(function(x){return x.idusuario == ID});
                    if(u){
                        // Mostrar datos reales de TU estructura
                        document.getElementById('info').innerHTML = 
                            '<b>ID:</b> '+(u.idusuario||'N/D')+'<br>'+
                            '<b>Nombre:</b> '+(u.nombre||'N/D')+'<br>'+
                            '<b>Rol:</b> '+(u.rol||'N/D')+'<br>'+
                            '<b>Activo:</b> '+(u.activo||'N/D')+'<br>'+
                            '<b>Último acceso:</b> '+(u.ultimoacceso||'N/D');
                        
                        var h = '<div class="card"><h3>📷 Fotos del Catálogo</h3>';
                        for(var i=1;i<=4;i++){
                            ft[i-1] = u['foto'+i] || '';
                            var desc = u['desc'+i] || '';
                            h += '<div class="fila">';
                            h += '<img id="img'+i+'" src="'+(ft[i-1]||'')+'">';
                            h += '<input type="file" accept="image/*" onchange="cargar('+i+',this)">';
                            h += '<input type="text" id="d'+i+'" value="'+desc+'" placeholder="Descripción foto '+i+'">';
                            h += '</div>';
                        }
                        h += '</div>';
                        document.getElementById('fotos').innerHTML = h;
                    } else {
                        document.getElementById('info').innerHTML = '⚠️ Usuario no encontrado';
                    }
                }
            }catch(e){
                document.getElementById('info').innerHTML = '❌ Error de conexión';
            }
        }

        function cargar(n,f){
            var r = new FileReader();
            r.onload = function(e){
                document.getElementById('img'+n).src = e.target.result;
                ft[n-1] = e.target.result;
            };
            r.readAsDataURL(f.files[0]);
        }

        async function guardar(){
            try{
                var r = await fetch(API,{method:'POST',body:JSON.stringify({
                    _accion:'guardar_catalogo',
                    idUsuario:ID,
                    foto1:ft[0],desc1:document.getElementById('d1').value,
                    foto2:ft[1],desc2:document.getElementById('d2').value,
                    foto3:ft[2],desc3:document.getElementById('d3').value,
                    foto4:ft[3],desc4:document.getElementById('d4').value
                })});
                var d = await r.json();
                var m = document.getElementById('msg');
                if(d.success){
                    m.className='msg ok';m.textContent='✅ Guardado';
                }else{
                    m.className='msg err';m.textContent='❌ Error: '+(d.message||'');
                }
                m.style.display='block';
                setTimeout(function(){m.style.display='none'},3000);
            }catch(e){
                var m = document.getElementById('msg');
                m.className='msg err';m.textContent='❌ Error de conexión';
                m.style.display='block';
            }
        }

        init();
    </script>
</body>
</html>
