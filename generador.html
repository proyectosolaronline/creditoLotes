<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador HTML - Panel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
        }

        .header p {
            font-size: 14px;
            opacity: .8;
            margin-top: 5px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #1a73e8;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8f0fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all .3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,115,232,.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all .3s;
        }

        .file-upload:hover {
            border-color: #1a73e8;
            background: #f8faff;
        }

        .file-upload img {
            max-width: 200px;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s;
        }

        .btn-primary {
            background: #1a73e8;
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26,115,232,.3);
        }

        .btn-success {
            background: #16a34a;
            color: #fff;
            width: 100%;
        }

        .btn-success:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(22,163,74,.3);
        }

        .preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .preview h3 {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏗️ Generador HTML - Panel Admin</h1>
        <p>Configura los datos de tu empresa y genera la landing page pública</p>
    </div>

    <div class="container">
        <!-- SECCIÓN 1: DATOS DE LA EMPRESA -->
        <div class="section">
            <div class="section-title">
                <span>🏢</span> Datos de la Empresa
            </div>

            <div class="form-group">
                <label>Nombre de la Empresa *</label>
                <input type="text" id="nombre-empresa" placeholder="Ej: Terrenos San Quintín">
            </div>

            <div class="form-group">
                <label>Descripción *</label>
                <textarea id="descripcion" placeholder="Describe tu empresa y los terrenos que ofreces..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" placeholder="Ej: Av. Principal #123, San Quintín">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" placeholder="Ej: 616-123-4567">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" id="whatsapp" placeholder="Ej: +526161234567">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Ej: info@terrenos.com">
                </div>
            </div>

            <div class="form-group">
                <label>Horarios</label>
                <input type="text" id="horarios" placeholder="Ej: Lun-Vie 9:00-18:00, Sáb 10:00-14:00">
            </div>

            <div class="form-group">
                <label>URL del Mapa de Lotes</label>
                <input type="url" id="url-mapa" placeholder="https://... tu mapa actual">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Logo de la Empresa</label>
                    <div class="file-upload" onclick="document.getElementById('logo-input').click()">
                        <div>📁 Subir Logo</div>
                        <img id="logo-preview" style="display:none;">
                    </div>
                    <input type="file" id="logo-input" accept="image/*" style="display:none;" onchange="previewImage(this, 'logo-preview')">
                </div>

                <div class="form-group">
                    <label>Foto Secundaria</label>
                    <div class="file-upload" onclick="document.getElementById('foto-input').click()">
                        <div>📁 Subir Foto</div>
                        <img id="foto-preview" style="display:none;">
                    </div>
                    <input type="file" id="foto-input" accept="image/*" style="display:none;" onchange="previewImage(this, 'foto-preview')">
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: CONEXIÓN GOOGLE SHEETS -->
        <div class="section">
            <div class="section-title">
                <span>📊</span> Conexión Google Sheets
            </div>

            <div class="form-group">
                <label>URL del Google Sheet (API)</label>
                <input type="url" id="sheet-url" placeholder="https://script.google.com/macros/s/...">
            </div>

            <button class="btn btn-primary" onclick="cargarDatosSheet()">
                📥 Cargar Datos de Lotes
            </button>

            <div id="lotes-preview" class="preview" style="display:none;">
                <h3>📋 Lotes Cargados: <span id="lotes-count">0</span></h3>
                <div id="lotes-lista"></div>
            </div>
        </div>

        <!-- SECCIÓN 3: GENERAR HTML -->
        <div class="section">
            <div class="section-title">
                <span>🚀</span> Generar HTML Público
            </div>

            <button class="btn btn-success" onclick="generarHTML()">
                🔨 Generar Landing Page
            </button>

            <div id="html-preview" class="preview" style="display:none;">
                <h3>👁️ Vista Previa del HTML Generado</h3>
                <button class="btn btn-primary" onclick="descargarHTML()" style="margin-bottom:15px;">
                    💾 Descargar HTML
                </button>
                <pre id="html-code" style="background:#fff;padding:15px;border-radius:8px;overflow-x:auto;font-size:12px;"></pre>
            </div>
        </div>
    </div>

    <script>
        let lotesData = [];
        let logoBase64 = '';
        let fotoBase64 = '';

        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(previewId);
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    if (previewId === 'logo-preview') {
                        logoBase64 = e.target.result;
                    } else {
                        fotoBase64 = e.target.result;
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function cargarDatosSheet() {
            const url = document.getElementById('sheet-url').value;
            if (!url) {
                alert('⚠️ Ingresa la URL del Google Sheet');
                return;
            }

            try {
                const response = await fetch(url + '?tipo=lotes');
                const result = await response.json();
                
                if (result.success && result.data && result.data.lotes) {
                    lotesData = result.data.lotes;
                    document.getElementById('lotes-preview').style.display = 'block';
                    document.getElementById('lotes-count').textContent = lotesData.length;
                    
                    const lista = document.getElementById('lotes-lista');
                    lista.innerHTML = lotesData.map(lote => `
                        <div style="padding:8px;border-bottom:1px solid #ddd;font-size:12px;">
                            🌱 ${lote.codigolote} - ${lote.estado} - $${Number(lote.valor).toLocaleString('es-MX')}
                        </div>
                    `).join('');
                }
            } catch (e) {
                alert('❌ Error al cargar datos del Sheet');
            }
        }

        function generarHTML() {
            const nombre = document.getElementById('nombre-empresa').value;
            if (!nombre) {
                alert('⚠️ El nombre de la empresa es obligatorio');
                return;
            }

            const htmlGenerado = generarLandingPage();
            
            document.getElementById('html-preview').style.display = 'block';
            document.getElementById('html-code').textContent = htmlGenerado;
        }

        function generarLandingPage() {
            const nombre = document.getElementById('nombre-empresa').value;
            const descripcion = document.getElementById('descripcion').value;
            const direccion = document.getElementById('direccion').value;
            const telefono = document.getElementById('telefono').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const email = document.getElementById('email').value;
            const horarios = document.getElementById('horarios').value;
            const urlMapa = document.getElementById('url-mapa').value;

            const lotesDisponibles = lotesData.filter(l => l.estado === 'Disponible');

            return `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${nombre} - Terrenos en San Quintín</title>
    <meta name="description" content="${descripcion.substring(0, 160)}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: #333; }
        .hero { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; padding: 60px 20px; text-align: center; }
        .hero img.logo { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 20px; border: 4px solid #fff; }
        .hero h1 { font-family: 'Outfit', sans-serif; font-size: 32px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .btn { display: inline-block; padding: 15px 30px; border-radius: 50px; font-weight: 700; text-decoration: none; margin: 10px; font-family: 'Outfit', sans-serif; }
        .btn-primary { background: #1a73e8; color: #fff; }
        .btn-success { background: #16a34a; color: #fff; }
        .lotes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .lote-card { border: 2px solid #e0e0e0; border-radius: 16px; padding: 20px; }
        .footer { background: #1a73e8; color: #fff; text-align: center; padding: 30px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="hero">
        ${logoBase64 ? `<img src="${logoBase64}" class="logo" alt="${nombre}">` : '<div style="font-size:60px;">🏗️</div>'}
        <h1>${nombre}</h1>
        <p>${descripcion}</p>
    </div>

    <div class="container">
        <div style="text-align:center;margin:30px 0;">
            <a href="#lotes" class="btn btn-success">📋 Ver Lotes Disponibles (${lotesDisponibles.length})</a>
            ${urlMapa ? `<a href="${urlMapa}" class="btn btn-primary">🗺️ Ver Mapa de Lotes</a>` : ''}
        </div>

        <h2 id="lotes" style="font-family:'Outfit',sans-serif;margin:30px 0;">🌱 Lotes Disponibles</h2>
        <div class="lotes-grid">
            ${lotesDisponibles.map(lote => `
                <div class="lote-card">
                    <h3>${lote.codigolote}</h3>
                    <p>💰 $${Number(lote.valor).toLocaleString('es-MX')}</p>
                    <p>📏 ${lote.medidas || 'Consultar'}</p>
                    <p>📍 ${lote.localidad || 'San Quintín'}</p>
                </div>
            `).join('')}
        </div>
    </div>

    <div class="footer">
        <p>📍 ${direccion}</p>
        <p>📞 ${telefono} | 📱 ${whatsapp} | ✉️ ${email}</p>
        <p>🕐 ${horarios}</p>
    </div>
</body>
</html>`;
        }

        function descargarHTML() {
            const html = document.getElementById('html-code').textContent;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'landing-page.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
